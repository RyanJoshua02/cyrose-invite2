
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cyrose Wedding Invitation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
    }
    .slideshow-container {
      position: relative;
      height: 100vh;
      width: 100vw;
    }
    .slide {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
    }
    .arrow {
      cursor: pointer;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      background-color: rgba(255,255,255,0.6);
      border-radius: 50%;
      text-align: center;
      line-height: 40px;
      font-size: 30px;
      z-index: 10;
      user-select: none;
    }
    .arrow:hover {
      background-color: rgba(255,255,255,0.8);
    }
    .prev { left: 10px; }
    .next { right: 10px; }
    audio { display: none; }
  </style>
</head>
<body>
  <div class="slideshow-container">
    <div class="slide" style="background-image: url('images/page1.jpg'); display: block;"></div>
    <div class="slide" style="background-image: url('images/page2.jpg');"></div>
    <div class="slide" style="background-image: url('images/page3.jpg');"></div>
    <div class="slide" style="background-image: url('images/page4.jpg');"></div>
    <div class="arrow prev">&#10094;</div>
    <div class="arrow next">&#10095;</div>
  </div>

  <audio autoplay loop>
    <source src="audio/cyroseinvitatio.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <script>
    let slideIndex = 0;
    const slides = document.querySelectorAll('.slide');
    const prev = document.querySelector('.prev');
    const next = document.querySelector('.next');

    function showSlide(index) {
      slides.forEach((slide, i) => {
        slide.style.display = i === index ? 'block' : 'none';
      });
    }

    function nextSlide() {
      slideIndex = (slideIndex + 1) % slides.length;
      showSlide(slideIndex);
    }

    function prevSlide() {
      slideIndex = (slideIndex - 1 + slides.length) % slides.length;
      showSlide(slideIndex);
    }

    next.addEventListener('click', nextSlide);
    prev.addEventListener('click', prevSlide);

    // Swipe support
    let touchStartX = 0;
    document.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    });
    document.addEventListener('touchend', (e) => {
      let touchEndX = e.changedTouches[0].screenX;
      if (touchStartX - touchEndX > 50) nextSlide();
      if (touchStartX - touchEndX < -50) prevSlide();
    });
  </script>
</body>
</html>
